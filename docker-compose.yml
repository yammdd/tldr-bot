services:
  tldr-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tldr-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HEALTH_PORT: "8080"
      DB_FILE_PATH: "/app/data/tldr_bot.db"
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
