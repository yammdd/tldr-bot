[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tldr-bot"
version = "1.0.0"
description = "Secure, fast, multi-server Discord TL;DR summarization bot supporting OpenAI-compatible LLM endpoints."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4.0",
    "openai>=1.55.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "tiktoken>=0.8.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
tldr-bot = "tldr_bot.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
